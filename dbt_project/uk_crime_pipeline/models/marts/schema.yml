version: 2

models:
  - name: fct_crimes
    description: One row per crime, cleaned and typed from raw_crimes.
    columns:
      - name: id
        tests:
          - unique
          - not_null

  - name: fct_stop_and_search
    description: >
      One row per stop and search, excluding ingest date and columns
      without data (policing operation).

  - name: fct_outcomes
    description: One row per outcome change.

  - name: agg_crimes_by_lsoa_force_month_category
    description: >
      Crime counts grouped by month, force (falls_within), LSOA and crime
      type. Note reported_by is deliberately excluded -- a crime can be
      reported by a different force than the one it falls within, which
      fragmented the intended grain.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month
            - falls_within
            - lsoa_code
            - crime_type
            - lsoa_name
    columns:
      - name: crime_type
        tests:
          - not_null
          - accepted_values:
              values: &crime_types
                - 'Violence and sexual offences'
                - 'Other theft'
                - 'Public order'
                - 'Other crime'
                - 'Robbery'
                - 'Shoplifting'
                - 'Bicycle theft'
                - 'Burglary'
                - 'Criminal damage and arson'
                - 'Anti-social behaviour'
                - 'Theft from the person'
                - 'Drugs'
                - 'Vehicle crime'
                - 'Possession of weapons'
      - name: month
        tests:
          - not_null

  - name: agg_crimes_by_month_category
    description: >
      National rollup: crime counts by month and crime type. Built on top
      of agg_crimes_by_lsoa_force_month_category rather than re-scanning
      fct_crimes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month
            - crime_type
    columns:
      - name: crime_type
        tests:
          - not_null
          - accepted_values:
              values: *crime_types
      - name: month
        tests:
          - not_null

  - name: agg_crimes_by_lsoa_force_month_category_dist
    description: >
      Each force's share of the national crime total, using falls_within.
      Collapses LSOA grain in a CTE before joining to the national rollup
      to avoid join fan-out.

  - name: agg_crimes_by_lsoa_latlong_month
    description: >
      One row per LSOA per month with a crime count and a representative
      coordinate (mean of that group's points, rounded to 4dp ~= 11m).
      Feeds the hotspot map -- aggregating here keeps the viz layer to a
      few thousand plottable points rather than 17M+ individual crimes.
      Keeps null-lsoa_code rows (unlike the marts downstream) so the
      report can quantify what the LSOA-based map excludes -- see
      docs/data-source-notes.md. Verified 2026-07-25: no row has null
      coordinates, including the null-LSOA ones.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - lsoa_code
            - month
    columns:
      - name: month
        tests:
          - not_null

  - name: agg_crimes_by_lsoa_monthly_vs_prior_year
    description: >
      One row per LSOA per month for each month this year, compares the crimes in said lsoa vs prior year with value and percent change.
      low crime dense areas are likley to show extreme percentages, these are to be filtered out in the visualisation.
      Excludes null lsoa codes -- note this means ENGLAND AND WALES ONLY.
      LSOAs are an England-and-Wales geography, so 100% of Police Service
      of Northern Ireland records (420,653 crimes) have no LSOA code and
      are structurally absent from this model, along with ~261,000 England
      and Wales crimes where the code is genuinely missing. Any report
      built on this must say it excludes Northern Ireland rather than
      leaving an unexplained gap. See docs/data-source-notes.md.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - lsoa_code
            - month
    columns:
      - name: month
        tests:
          - not_null

  - name: agg_crimes_by_lsoa_ytd_vs_prior_year
    description: >
      One row per LSOA YTD this year until the latest record, the same months
      and the values of crimes within the LSOA codes are compared giving percent
      changes vs the prior year
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - lsoa_code
    columns:
      - name: losa_code
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null
      - name: latitude
        tests:
          - not_null