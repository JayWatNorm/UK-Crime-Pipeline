name: 'uk_crime_pipeline'
version: '1.0.0'

# Must match the top-level key in profiles.yml -- exact, case-sensitive.
profile: 'uk_crime_pipeline'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Both overridable via env var so a containerised run can write these
# somewhere it actually owns. Needed because the Airflow container runs as
# a different user than whoever owns the bind-mounted project source, and
# `dbt deps` has no CLI flag for packages-install-path -- it can only be
# set here.
target-path: "{{ env_var('DBT_TARGET_PATH', 'target') }}"
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  uk_crime_pipeline:
    # Staging models are views (cheap, always-fresh passthroughs); marts
    # set their own materialization per-model via {{ config(...) }}.
    staging:
      +materialized: view
